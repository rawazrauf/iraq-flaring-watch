<!-- Load Noto Sans Arabic so Arabic & Kurdish render cleanly even on devices
     that don't ship the font (common on low-end Androids). The font-family
     stack already references it; this actually makes it available. -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

<style>
:root{
  --ink:#14261B;        /* deep field green-black */
  --paper:#F3EFE4;      /* dry-soil paper */
  --clay:#B4552D;       /* arid clay (bad NDVI end) */
  --canal:#1E6E5A;      /* irrigation green (good NDVI end) */
  --wheat:#D9A441;      /* accent / ripe */
  --line:#C9BFA8;
  --panel:rgba(243,239,228,.94);
  --shadow:0 2px 14px rgba(20,38,27,.18);
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--ink);
  font-family:ui-sans-serif,system-ui,"Segoe UI",Roboto,"Noto Sans Arabic","Noto Kufi Arabic",sans-serif;
  color:var(--ink);overscroll-behavior:none}
#map{position:absolute;inset:0}
[dir="rtl"]{direction:rtl}

/* top bar */
#bar{position:absolute;top:calc(var(--safe-t) + 8px);left:8px;right:8px;z-index:5;
  display:flex;gap:8px;align-items:center;pointer-events:none}
#title{pointer-events:auto;background:var(--panel);backdrop-filter:blur(6px);
  border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);
  padding:8px 12px;font-weight:800;letter-spacing:.2px;font-size:15px;line-height:1;
  display:flex;align-items:center;gap:8px}
#title .dot{width:9px;height:9px;border-radius:50%;background:var(--canal);flex:0 0 auto}
#lang{pointer-events:auto;margin-inline-start:auto;display:flex;gap:4px;
  background:var(--panel);border:1px solid var(--line);border-radius:12px;
  box-shadow:var(--shadow);padding:4px}
#lang button{border:0;background:transparent;font:inherit;font-weight:700;font-size:13px;
  padding:6px 9px;border-radius:8px;color:var(--ink);opacity:.55;cursor:pointer}
#lang button.on{opacity:1;background:var(--ink);color:var(--paper)}

/* legend */
#legend{position:absolute;top:calc(var(--safe-t) + 60px);inset-inline-start:8px;z-index:4;
  background:var(--panel);border:1px solid var(--line);border-radius:12px;
  box-shadow:var(--shadow);padding:8px 10px;font-size:12px;max-width:46vw}
#legend .lbl{font-weight:700;margin-bottom:6px}
#ramp{height:10px;border-radius:6px;
  background:linear-gradient(90deg,var(--clay),#E8C15A,var(--canal))}
#legend .ends{display:flex;justify-content:space-between;margin-top:4px;opacity:.7;font-weight:600}

/* diagnostic panel */
/* Physical `left` for the same reason as the control cluster above: in RTL the
   logical start edge is the right, which put this panel under the zoom buttons. */
#diag{position:absolute;bottom:calc(var(--safe-b) + 8px);left:8px;right:auto;z-index:4;
  background:rgba(20,38,27,.82);color:#DCE7DF;backdrop-filter:blur(6px);
  border-radius:10px;padding:7px 9px;font:600 11px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;
  box-shadow:var(--shadow);max-width:60vw;
  /* coordinates and build stamp are LTR data whatever the UI language */
  direction:ltr;text-align:left}
#diag .row{display:flex;gap:6px;white-space:nowrap}
#diag .k{opacity:.55}
#diag .ok{color:#7FD6A6}#diag .warn{color:var(--wheat)}#diag .err{color:#F0876B}
#diag .geo{margin-top:3px;padding-top:3px;border-top:1px solid rgba(255,255,255,.12);
  font-size:10px;letter-spacing:.3px}

/* error banner */
#err{position:absolute;top:calc(var(--safe-t) + 8px);left:8px;right:8px;z-index:9;
  display:none;background:var(--clay);color:#fff;border-radius:10px;padding:10px 12px;
  font-size:13px;font-weight:600;box-shadow:var(--shadow)}

/* field sheet */
#sheet{position:absolute;left:0;right:0;bottom:0;z-index:7;
  transform:translateY(100%);transition:transform .28s cubic-bezier(.3,.8,.3,1);
  background:var(--paper);border-top-left-radius:18px;border-top-right-radius:18px;
  box-shadow:0 -4px 24px rgba(20,38,27,.28);padding:12px 14px calc(var(--safe-b) + 14px)}
#sheet.open{transform:translateY(0)}
#sheet .grip{width:38px;height:4px;border-radius:2px;background:var(--line);
  margin:0 auto 10px;position:relative}
/* The visible grip is 4px tall — far too small a target for a thumb. This
   invisible box gives it a ~34px tall, 120px wide grab area without changing
   how it looks. */
#sheet .grip::before{content:"";position:absolute;left:50%;top:50%;
  transform:translate(-50%,-50%);width:120px;height:34px}
#sheet .grip,#sheet h2,#sheet .sub{touch-action:none;cursor:grab}
#sheet.dragging{transition:none}
#sheet h2{margin:0 0 2px;font-size:16px;font-weight:800}
#sheet .sub{margin:0 0 10px;font-size:12px;opacity:.6;font-weight:600}
#sheet .close{position:absolute;top:12px;inset-inline-end:14px;border:0;background:transparent;
  font-size:20px;line-height:1;color:var(--ink);opacity:.5;cursor:pointer;padding:4px}
#stat{display:flex;gap:8px;margin-bottom:10px}
#stat .card{flex:1;min-width:0;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 9px}
.nbr{display:flex;align-items:center;gap:7px;margin-top:9px;font-size:13px;font-weight:700;
  color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 11px}
.nbr .nbr-ico{font-size:14px;flex:0 0 auto}
.nbr.loading{opacity:.55;font-weight:600}
#stat .card .n{font-size:20px;font-weight:800;line-height:1;white-space:nowrap}
#stat .card .c{font-size:10px;font-weight:700;opacity:.6;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#spark{width:100%;height:110px;display:block;background:#fff;border:1px solid var(--line);border-radius:12px}
#spark-wrap{position:relative}
#spark-tip{position:absolute;pointer-events:none;z-index:3;transform:translate(-50%,-115%);
  background:var(--ink);color:#F3EFE4;border-radius:8px;padding:5px 8px;white-space:nowrap;
  box-shadow:0 2px 8px rgba(20,38,27,.28);font-size:12px;font-weight:700;line-height:1.25}
#spark-tip .tv{font-size:14px}
#spark-tip .td{font-size:10.5px;font-weight:600;opacity:.75}
#spark-tip::after{content:"";position:absolute;left:50%;bottom:-5px;transform:translateX(-50%);
  border:5px solid transparent;border-top-color:var(--ink);border-bottom:0}
#spark-prov{position:absolute;right:8px;top:8px;z-index:4;max-width:min(88%,340px);
  background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;
  box-shadow:0 4px 18px rgba(20,38,27,.22)}
#spark-prov .pv-row{font-size:13px;font-weight:700;color:var(--ink);margin-bottom:4px}
#spark-prov .pv-scene{font-size:11px;font-weight:600;color:#6B6350;
  word-break:break-all;line-height:1.35}
#spark-prov .pv-links{display:flex;flex-direction:column;gap:6px;margin-top:8px}
#spark-prov .pv-link{display:inline-block;font-size:13px;font-weight:800;
  color:var(--canal);text-decoration:none;border:1.5px solid var(--canal);
  border-radius:8px;padding:5px 10px;text-align:center}
#spark-prov .pv-primary{color:#fff;background:var(--canal)}
#spark-prov .pv-close{position:absolute;top:6px;inset-inline-end:8px;border:0;background:transparent;
  font-size:18px;line-height:1;color:var(--ink);opacity:.5;cursor:pointer;padding:2px}
#sheet .msg{margin:12px 0 2px;padding:12px 14px;border-radius:12px;
  border-inline-start:4px solid var(--line);background:#fff}
#sheet .msg-main{font-size:14px;font-weight:700;line-height:1.35;color:var(--ink)}
#sheet .msg-sub{font-size:12.5px;font-weight:600;line-height:1.3;margin-top:4px;opacity:.72}
/* health-band tints */
#sheet .msg.poor{background:#FBEDE6;border-inline-start-color:var(--clay)}
#sheet .msg.poor .msg-main{color:#8A3A18}
#sheet .msg.fair{background:#FBF3E0;border-inline-start-color:var(--wheat)}
#sheet .msg.fair .msg-main{color:#8A6410}
#sheet .msg.good{background:#E9F3EC;border-inline-start-color:var(--canal)}
#sheet .msg.good .msg-main{color:#155844}
#sheet .msg.none{background:#F0EDE3;border-inline-start-color:var(--line)}
#sheet .load{padding:26px 0;text-align:center;font-size:13px;font-weight:700;opacity:.6}

/* tools: search + my-fields */
#tools{position:absolute;top:calc(var(--safe-t) + 60px);inset-inline-end:8px;z-index:5;
  display:flex;flex-direction:column;gap:6px;align-items:flex-end;pointer-events:none}
#search-wrap{pointer-events:auto;display:flex;gap:4px;background:var(--panel);
  border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:4px}
#search-input{border:0;background:transparent;font:inherit;font-size:13px;font-weight:600;
  padding:5px 8px;width:min(46vw,190px);color:var(--ink);outline:none}
#search-go{border:0;background:var(--ink);color:var(--paper);font:inherit;font-weight:800;
  font-size:12px;border-radius:8px;padding:5px 10px;cursor:pointer}
#pins-toggle{pointer-events:auto;border:1px solid var(--line);background:var(--panel);
  box-shadow:var(--shadow);font:inherit;font-weight:800;font-size:12px;color:var(--ink);
  border-radius:12px;padding:7px 11px;cursor:pointer;display:flex;align-items:center;gap:5px}
#pins-toggle #pins-count{opacity:.6;font-weight:700}
#help-btn{pointer-events:auto;border:1px solid var(--line);background:var(--panel);
  box-shadow:var(--shadow);font:inherit;font-weight:800;font-size:12px;color:var(--ink);
  border-radius:12px;padding:7px 11px;cursor:pointer}
#health-toggle{pointer-events:auto;border:1px solid var(--line);background:var(--panel);
  box-shadow:var(--shadow);font:inherit;font-weight:800;font-size:12px;color:var(--ink);
  border-radius:12px;padding:7px 11px;cursor:pointer;display:flex;align-items:center;gap:5px;opacity:.55}
#health-toggle.on{opacity:1;background:var(--ink);color:var(--paper)}
/* Crop-type toggle. Tints to the layer's own colour when on, so the button
   doubles as the legend. */
#crop-toggle{pointer-events:auto;border:1px solid var(--line);background:var(--panel);
  box-shadow:var(--shadow);font:inherit;font-weight:800;font-size:12px;color:var(--ink);
  border-radius:12px;padding:7px 11px;cursor:pointer;display:flex;align-items:center;gap:5px;opacity:.55}
#crop-toggle.wintercereals{opacity:1;background:#8a5324;color:#fff;border-color:#8a5324}
#hist-toggle{pointer-events:auto;border:1px solid var(--line);background:var(--panel);
  box-shadow:var(--shadow);font:inherit;font-weight:800;font-size:12px;color:var(--ink);
  border-radius:12px;padding:7px 11px;cursor:pointer;display:flex;align-items:center;gap:5px}
#hist-toggle #hist-count{opacity:.6;font-weight:700}
#hist-panel{position:absolute;top:calc(var(--safe-t) + 60px);inset-inline-end:8px;z-index:6;
  width:min(84vw,300px);max-height:64vh;overflow:auto;background:var(--paper);
  border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:8px}
#hist-list .hrow{display:flex;align-items:center;gap:9px;padding:8px;border-radius:10px;cursor:pointer}
#hist-list .hrow:hover{background:#fff}
#hist-list .hrank{font-size:15px;font-weight:800;width:26px;text-align:center;flex:0 0 auto}
#hist-list .hsw{width:11px;height:11px;border-radius:3px;flex:0 0 auto}
#hist-list .hbody{min-width:0;flex:1}
#hist-list .hid{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hist-list .hsub{font-size:11px;opacity:.6;font-weight:600}
#hist-list .himp{margin-inline-start:auto;font-weight:800;font-size:13px;white-space:nowrap}
#hist-empty{font-size:12px;opacity:.6;font-weight:600;padding:8px;text-align:center;line-height:1.5}
#zoom-hint[hidden]{display:none !important}
#zoom-hint{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  z-index:6;background:var(--ink);color:var(--paper);border-radius:999px;
  padding:11px 18px;font-size:14px;font-weight:700;box-shadow:var(--shadow);
  display:flex;align-items:center;gap:7px;white-space:nowrap;pointer-events:none;
  animation:zoomhintin .25s ease}
#zoom-hint::before{content:"🔍";font-size:14px}
#locate-toast[hidden]{display:none !important}
#locate-toast{position:absolute;bottom:96px;left:50%;transform:translateX(-50%);
  z-index:7;background:var(--ink);color:var(--paper);border-radius:16px;
  padding:12px 18px;font-size:14px;font-weight:600;box-shadow:var(--shadow);
  max-width:min(86vw,420px);text-align:center;line-height:1.4;
  animation:zoomhintin .25s ease}
/* Floating "find my location" button — modern circular FAB, thumb-reachable
   bottom-right, sitting just above the MapLibre zoom control. */
/* Group the location FAB and the zoom +/- control into one right-edge cluster.
   The zoom control (MapLibre default) sits bottom-right; we pin its right margin
   to match the FAB, and place the FAB just above it with a small gap so the two
   read as a single stack of map controls rather than two floating things. */
/* Physical `right`, not `inset-inline-end`: in Arabic/Kurdish (dir=rtl) the
   logical property flipped this cluster to the left edge while MapLibre's own
   `.maplibregl-ctrl-bottom-right{right:0}` stayed put, so the zoom buttons, the
   locate FAB and the diagnostics panel all piled up on top of each other. Map
   controls are chrome, not text — they stay bottom-right in every language. */
.maplibregl-ctrl-bottom-right{margin:0;right:12px;left:auto;
  bottom:calc(var(--safe-b) + 12px)}
.maplibregl-ctrl-bottom-right .maplibregl-ctrl{margin:0}
#locate-fab{position:absolute;right:12px;left:auto;z-index:6;
  /* zoom control is ~64px tall + 12px from bottom; sit 8px above it */
  bottom:calc(var(--safe-b) + 12px + 64px + 8px);
  width:48px;height:48px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:var(--panel);color:var(--ink);
  border:1px solid var(--line);box-shadow:var(--shadow);
  backdrop-filter:blur(6px);cursor:pointer;
  transition:transform .12s ease, background .18s ease, color .18s ease;
  -webkit-tap-highlight-color:transparent;pointer-events:auto}
#locate-fab:active{transform:scale(.92)}
#locate-fab.active{background:var(--canal);color:#fff;border-color:var(--canal)}
#locate-fab.locating{background:var(--canal);color:#fff;border-color:var(--canal)}
#locate-fab.locating svg{animation:locspin 1s linear infinite}
@keyframes locspin{to{transform:rotate(360deg)}}
/* Pulsing halo while locating */
#locate-fab.locating::after{content:"";position:absolute;inset:-4px;
  border-radius:50%;border:2px solid var(--canal);opacity:.6;
  animation:locpulse 1.3s ease-out infinite}
@keyframes locpulse{0%{transform:scale(.9);opacity:.6}
  100%{transform:scale(1.5);opacity:0}}
@keyframes zoomhintin{from{opacity:0;transform:translate(-50%,-50%) scale(.94)}
  to{opacity:1;transform:translate(-50%,-50%) scale(1)}}

/* first-run guided tour */
#tour{position:fixed;inset:0;z-index:50}
#tour-dim{position:absolute;inset:0;background:rgba(20,38,27,.62)}
#tour-hole{position:absolute;border-radius:14px;box-shadow:0 0 0 9999px rgba(20,38,27,.62);

<noscript>
  <main style="max-width:760px;margin:2rem auto;padding:1rem;font-family:system-ui,sans-serif;line-height:1.6;color:#14261B">
  <h1>Iraq Farms Health — Satellite Crop &amp; Field Health Map</h1>
  <p><strong>Iraq Farms Health</strong> is a free, mobile-friendly tool that shows the
  vegetation health of farm fields across Iraq using satellite imagery. It is built for
  smallholder farmers, agronomists, agricultural suppliers, and researchers who want a
  quick, trustworthy read on how a field's crops are doing — from a phone, in the field.</p>

  <h2>What it does</h2>
  <p>Open the interactive map, zoom to your area, and tap any field. The tool reads the
  latest cloud-free <strong>Sentinel-2</strong> satellite image and calculates
  <strong>NDVI</strong> (the Normalized Difference Vegetation Index — a standard measure
  of plant health) for that exact field. You see a simple health rating (Poor, Fair or
  Good), the current vegetation index, a <strong>two-year month-by-month trend</strong>,
  and a <strong>year-on-year comparison</strong> that tells you whether this season is
  greener or drier than the last.</p>

  <h2>Verify any reading yourself</h2>
  <p>Every figure can be checked independently. Each reading links out to the free
  <strong>Copernicus Browser</strong> from the European Space Agency, opened on the same
  field and the same satellite date, so a farmer, a buyer, or a supplier can confirm the
  numbers for themselves. Nothing is taken on trust.</p>

  <h2>Built for Iraq, in three languages</h2>
  <p>The tool works in <strong>English</strong>, <strong>Arabic (العربية)</strong> and
  <strong>Kurdish (کوردی)</strong>, with field boundaries covering the whole country and
  place names and governorate borders to help you navigate. Field data comes from the
  open <em>Fields of the World</em> dataset; imagery from the EU Copernicus programme's
  Sentinel-2 satellites.</p>

  <h2>Free and private</h2>
  <p>Iraq Farms Health is free to use and runs entirely in your browser. Your saved
  fields and history stay on your own device. This application requires JavaScript to
  display the interactive map — please enable JavaScript to use it.</p>

  <p><a href="https://www.iraqfarmshealth.com/">www.iraqfarmshealth.com</a></p>
  </main>

/* ---------- EMERGENCY on-screen debug log (remove once NDVI is fixed) ----------
   Fixed panel at the top of the screen. Every Planetary Computer request, every
   swallowed stats failure, and any uncaught error/rejection lands here, so an
   iPhone screenshot shows exactly where the NDVI pipeline breaks. */
const DBG = (function(){
  // Off by default: ?debug=1 shows the on-screen log, ?probe=1 also runs the
  // connectivity probe. Kept in the shipped file because when a third-party API
  // breaks (see the CORS note in ndviForWindow), a phone screenshot of this log
  // is the fastest route to a diagnosis on a device with no dev tools.
  const on = new URLSearchParams(location.search).get("debug")==="1";
  if(!on){ const noop = ()=>{}; return {log:noop, err:noop, warn:noop}; }
  const box = document.createElement("div");
  box.id = "dbg";
  box.style.cssText = "position:fixed;left:6px;right:6px;top:calc(env(safe-area-inset-top,0px) + 6px);"+
    "max-height:38vh;overflow:auto;z-index:99999;background:rgba(0,0,0,.88);color:#9f9;"+
    "font:11px/1.35 ui-monospace,Menlo,monospace;padding:6px 8px;border-radius:8px;"+
    "white-space:pre-wrap;word-break:break-all;direction:ltr;text-align:left;-webkit-user-select:text;user-select:text";
  const bar = document.createElement("div");
  bar.style.cssText = "position:sticky;top:0;display:flex;gap:6px;justify-content:flex-end;background:rgba(0,0,0,.9);padding-bottom:4px";
  const mk = (label, fn)=>{ const b=document.createElement("button"); b.textContent=label;
    b.style.cssText="font:11px ui-monospace,Menlo,monospace;background:#333;color:#fff;border:0;border-radius:4px;padding:3px 8px";
    b.onclick=fn; bar.appendChild(b); return b; };
  const body = document.createElement("div");
  const lines = [];
  mk("copy", ()=>{ const t=lines.join("\n"); (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).catch(()=>prompt("log",t)); });
  mk("clear", ()=>{ lines.length=0; body.textContent=""; });
  const hideBtn = mk("hide", ()=>{ const h=body.style.display==="none"; body.style.display=h?"":"none"; hideBtn.textContent=h?"hide":"show"; });
  box.appendChild(bar); box.appendChild(body);
  const t0 = performance.now();
  let lastKey = null, lastDiv = null, rep = 0;
  function log(msg, lvl){
    const ts = ((performance.now()-t0)/1000).toFixed(1).padStart(6);
    const key = msg.replace(/\d+ms|try \d+/g,"");
    if(key===lastKey && lastDiv){ rep++; lastDiv.textContent = ts+"s "+msg+"  ×"+(rep+1); lines[lines.length-1]=lastDiv.textContent; return; }
    lastKey = key; rep = 0;
    const line = ts+"s "+msg;
    lines.push(line); if(lines.length>400) lines.shift();
    const d = document.createElement("div");
    d.textContent = line;
    if(lvl==="err") d.style.color="#f88"; else if(lvl==="warn") d.style.color="#fd6";
    body.appendChild(d); lastDiv = d;
    while(body.childNodes.length>400) body.removeChild(body.firstChild);
    box.scrollTop = box.scrollHeight;
  }
  const mount = ()=>document.body.appendChild(box);
  if(document.body) mount(); else document.addEventListener("DOMContentLoaded", mount);
  window.addEventListener("error", e=>log("UNCAUGHT "+(e.message||e)+" @"+(e.filename||"").split("/").pop()+":"+e.lineno, "err"));
  window.addEventListener("unhandledrejection", e=>log("UNHANDLED "+((e.reason&&(e.reason.stack||e.reason.message))||e.reason), "err"));
  log("debug on · "+navigator.userAgent.replace(/^.*?\(/,"(").slice(0,90));
  return { log, err:m=>log(m,"err"), warn:m=>log(m,"warn") };
})();
/* Connectivity probe — runs once on load, sequentially, before the sampler floods.
   no-cors tells us if the host is reachable at all (opaque response = reachable).
   GET search is a CORS "simple" request (no preflight); POST+JSON needs preflight.
   Comparing them isolates: network/DNS/blocker vs CORS vs preflight-only. */
async function dbgProbe(){
  const H = "https://planetarycomputer.microsoft.com";
  const bb = "43.20,36.22,43.21,36.23";
  const tests = [
    ["reach stac (no-cors)", H+"/api/stac/v1/", {mode:"no-cors"}],
    ["reach data (no-cors)", H+"/api/data/v1/", {mode:"no-cors"}],
    ["GET stac landing",      H+"/api/stac/v1/", {}],
    ["GET search (simple)",   H+"/api/stac/v1/search?collections=sentinel-2-l2a&bbox="+bb+"&limit=1", {}],
    ["POST search json",      H+"/api/stac/v1/search", {method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},
                                 body:JSON.stringify({collections:["sentinel-2-l2a"],bbox:bb.split(",").map(Number),limit:1})}],
    ["POST search text/plain",H+"/api/stac/v1/search", {method:"POST",headers:{"Content-Type":"text/plain"},
                                 body:JSON.stringify({collections:["sentinel-2-l2a"],bbox:bb.split(",").map(Number),limit:1})}],
    ["GET search sortby",     H+"/api/stac/v1/search?collections=sentinel-2-l2a&bbox="+bb+"&sortby=%2Beo:cloud_cover&limit=2", {}],
    ["POST stats blob (new)", H+"/api/data/v1/item/statistics?collection=sentinel-2-l2a&item=__probe__&expression=(B08-B04)/(B08%2BB04)&asset_as_band=true",
                              {method:"POST", body:new Blob([JSON.stringify({type:"Feature",properties:{},geometry:{type:"Polygon",coordinates:[[[43.20,36.22],[43.21,36.22],[43.21,36.23],[43.20,36.23],[43.20,36.22]]]}})])}],
  ];
  DBG.warn("PROBE start");   // only reached via ?probe=1
  for(const [name,url,opts] of tests){
    const t=performance.now();
    try{
      const r = await fetch(url, {...opts, cache:"no-store"});
      let extra = r.type==="opaque" ? "opaque (host reachable)" : "";
      if(r.type!=="opaque"){ try{ extra=(await r.text()).slice(0,120).replace(/\s+/g," "); }catch{} }
      DBG.warn(`PROBE ${name}: ${r.type} ${r.status} ${Math.round(performance.now()-t)}ms ${extra}`);
    }catch(e){ DBG.err(`PROBE ${name}: THREW ${e.name}: ${e.message} ${Math.round(performance.now()-t)}ms`); }
  }
  DBG.warn("PROBE done · online="+navigator.onLine);
}

/* NDVI on Sentinel-2 L2A.
   IMPORTANT: since ESA Processing Baseline 04.00 (Jan 2022), reflectance is
   stored with a +1000 DN radiometric offset. PC serves RAW DN (offset NOT
   removed); Copernicus/Sentinel Hub remove it. In a normalized-difference
   index the shared *scale* cancels but the *additive offset does not* — it
   inflates the denominator (B08+B04) and squishes NDVI low. All our scenes are
   post-2022, so we subtract 1000 from each band to match ESA's harmonized
   values. This is what closed the ~0.2 gap vs Copernicus (0.54 -> ~0.74). */
/* NDVI on Sentinel-2 L2A, using the STANDARD formula (B08-B04)/(B08+B04) — the
   same one Copernicus Browser uses. An earlier "offset-corrected" variant
   (subtracting the PB04.00 +1000 DN offset from each band) was tried to chase an
   accuracy gap, but a direct cross-check against Copernicus's own Statistical Info
   showed the standard formula actually MATCHES Copernicus (~0.51-0.56 on a test
   field) while the offset version diverged (0.79) AND could blow up past NDVI's
   valid range when the denominator neared zero. So: standard formula. Both bands
   are positive DN, so the denominator is always well clear of zero — no blowup.
   A [-1,1] range check remains in code as a belt-and-suspenders safety net. */
const NDVI_EXPR = "(B08-B04)/(B08+B04)";

/* ---------- MODIS NDVI backdrop helpers ----------------------------------
   GIBS files each 8-day composite under its window's START date, on a grid
   that restarts every 1 January (day-of-year 1, 9, 17 …). A date one day off
   that grid 404s, and composites publish roughly two weeks in arrears, so the
   newest window is resolved at runtime rather than hardcoded. */
const GIBS_NDVI_LAYER = "MODIS_Terra_NDVI_8Day";
const GIBS_NDVI_TMS   = "GoogleMapsCompatible_Level9";

function gibsNdviTiles(date){
  return "https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/"+GIBS_NDVI_LAYER+
         "/default/"+date+"/"+GIBS_NDVI_TMS+"/{z}/{y}/{x}.png";
}

// Recent window starts, newest first.
function ndviWindowStarts(count){
  const out=[], today=new Date();
  let year=today.getUTCFullYear();
  while(out.length<count){
    const jan1=Date.UTC(year,0,1);
    const end=(year===today.getUTCFullYear())
      ? Math.floor((today-jan1)/86400000)+1 : 366;
    for(let doy=1; doy<=end; doy+=8)
      out.push(new Date(jan1+(doy-1)*86400000).toISOString().slice(0,10));
    out.sort().reverse(); year--;
  }
  return out.slice(0,count);
}

/* An unpublished window answers 404, and a published-but-empty one answers 200
   with a tiny fully transparent PNG — so neither the status code alone nor a
   canvas pixel read (which needs CORS on the IMAGE request, a separate grant
   from the one fetch gets) is reliable. Byte size settles it: a real NDVI tile
   over Iraq is tens of KB, an empty one is a few hundred bytes.
   Probe tile covers central Iraq at z6. */
async function ndviWindowHasData(date){
  const url = gibsNdviTiles(date)
    .replace("{z}","6").replace("{y}","25").replace("{x}","39");
  try{
    const ctrl = new AbortController();
    const timer = setTimeout(()=>ctrl.abort(), 6000);
    const r = await fetch(url, {cache:"no-store", signal:ctrl.signal});
    clearTimeout(timer);
    if(!r.ok){ DBG.log("ndvi "+date+": HTTP "+r.status); return false; }
    const b = await r.blob();
    DBG.log("ndvi "+date+": "+r.status+" "+b.size+"B");
    return b.size > 1500;
  }catch(e){
    DBG.err("ndvi "+date+": "+e.name+" "+(e.message||""));
    return false;
  }
}

// Newest window with actual imagery, or null. Normally settles on the 2nd or 3rd.
async function resolveNdviWindow(){
  const candidates = ndviWindowStarts(10);
  for(const d of candidates){
    if(await ndviWindowHasData(d)) return d;
  }
  /* Nothing verified. Rather than show no backdrop at all, fall back to a
     window about three weeks back — comfortably inside GIBS's publishing lag.
     If those tiles don't exist either, MapLibre simply draws nothing. */
  DBG.warn("NDVI backdrop: no window verified, falling back to "+candidates[3]);
  return candidates[3] || null;
}

        ],tileSize:256,attribution:"Esri, Maxar, Earthstar Geographics"},
        places:{type:"raster",tiles:[
          "https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}"
        ],tileSize:256,attribution:"Esri"},
        roads:{type:"raster",tiles:[
          "https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}"
        ],tileSize:256,attribution:"Esri"}
      },
      layers:[{id:"sat",type:"raster",source:"esri"}]
    },
    center:[43.1995,36.2282], zoom:14.8, maxZoom:16, minZoom:4,
    attributionControl:false,
    /* Straight-down view only. A two-finger drag would otherwise tilt the map
       into a pitched pseudo-3D view, which tells a farmer nothing about a flat
       field, distorts the health colours by foreshortening them, and is hard to
       undo without a compass control. Rotation goes too, for the same reason:
       north-up keeps the map matching every other map the user has seen. */
    pitchWithRotate:false, dragRotate:false, touchPitch:false,
    maxPitch:0, bearingSnap:0
  });
  // The two-finger gesture also rotates; keep the zoom half, drop the rotate.
  map.touchZoomRotate.disableRotation();
  map.addControl(new maplibregl.NavigationControl({showCompass:false}),"bottom-right");
  map.on("error",e=>{ if(e && e.error) console.warn("map:",e.error.message); });


  map.on("load", onMapLoad);
}catch(e){ showErr("Map failed to start: "+e.message); }

function onMapLoad(){
  // --- place-name + road labels overlay (transparent, no polygons) ---
  // Sits above imagery for orientation; NDVI is inserted beneath it and the
  // field outlines above it, so labels stay readable without clutter.
  // Esri reference overlays for orientation: transportation (roads) first, then
  // boundaries & place names on top. NDVI goes beneath these; field outlines above.
  try{
    map.addLayer({id:"roads",type:"raster",source:"roads",
      paint:{"raster-opacity":0.85}});
    map.addLayer({id:"labels",type:"raster",source:"places",
      paint:{"raster-opacity":0.95}});
  }catch(e){ console.warn("reference:",e.message); }

  // (Governorate boundaries + city labels come from the Esri reference layer
  // above. A previous custom Natural Earth boundary layer was removed to avoid
  // drawing a second, slightly-offset set of boundary lines.)

  // --- surface water occurrence (JRC Global Surface Water, 1984–2024) ---
  // Ready-made raster tiles from the EU JRC / Google dataset: pixels coloured by
  // how often they were water over ~40 years (white→pink→blue, blue = permanent).
  // On by default and no longer toggleable: rivers, marshes and reservoirs are
  // orientation, not an optional analysis layer, and the control stack was a
  // button deeper than a phone screen wants. Sits above satellite but below the
  // field outlines and labels so boundaries and place names stay readable.
  // Attribution: EC JRC/Google (required). Tiles top out around zoom 13.
  try{
    map.addSource("water-occ",{
      type:"raster",
      tiles:["https://storage.googleapis.com/global-surface-water/tiles2021/occurrence/{z}/{x}/{y}.png"],
      tileSize:256, maxzoom:13,
      attribution:"Surface water: EC JRC/Google"
    });
    map.addLayer({
      id:"water-occ", type:"raster", source:"water-occ",
      paint:{"raster-opacity":0.85}
    }, map.getLayer("roads") ? "roads" : undefined);
  }catch(e){ console.warn("water layer:",e.message); }

  // --- ESA WorldCereal 2021 winter cereals (what is usually grown here) ---
  // 10 m classification mask via Terrascope WMTS. Off by default, toggled by
  // the Crops button.
  //
  // REQUEST FORM, verified on-device 2026-10-17: KVP GetTile with an INTEGER
  // TileMatrix and TIME as a query parameter. The RESTful templates that the
  // service's own capabilities document advertises are not served — they answer
  // "Missing WMTS 'SERVICE' parameter" — and omitting TIME gives a 400.
  //
  // COLORMAP: class 0 is deliberately left out so non-crop pixels stay
  // transparent. The service's default paints 0 solid grey, which would blanket
  // the country.
  //
  // One of the six published products is used. The others were examined on
  // device and dropped: spring cereals is empty across Iraq (spring sowing
  // belongs to cold-winter climates); maize maps nothing here even though maize
  // IS grown in central Iraq — a gap in the product, not in the agriculture;
  // active cropland is too noisy to read; irrigation over-calls badly across the
  // rainfed north, which would tell a farmer in Dohuk his rainfed field is
  // irrigated. Temporary crops was dropped too: it is the parent class of all
  // annual cropland, so it largely restates what the field outlines already
  // show, and the gap between it and winter cereals invites inference about
  // which crop is which — which this app does not do.
  //
  // minzoom 11: this is 10 m data about individual fields, and at country scale
  // it would fight the NDVI backdrop. The backdrop is gone by z12, so the two
  // barely overlap.
  try{
    map.addSource("wc-wintercereals",{
      type:"raster",
      tiles:[wcTiles("wintercereals","#ba7135")],
      tileSize:256, minzoom:11, maxzoom:14,
      attribution:"Crop type: ESA WorldCereal 2021 (CC-BY 4.0)"
    });
    map.addLayer({
      id:"wc-wintercereals", type:"raster", source:"wc-wintercereals",
      minzoom:11,
      layout:{visibility:"none"},
      paint:{"raster-opacity":0.55,"raster-fade-duration":200}
    }, map.getLayer("roads") ? "roads" : undefined);
  }catch(e){ console.warn("worldcereal layer:",e.message); }

  // --- field-only health colouring ---
  // Instead of a raster wash across the whole map (which blended with satellite
  // greenery and confused users), we colour ONLY detected fields by their NDVI.
  // Each visible field is sampled via the same /statistics endpoint the tap uses,
  // then filled with the matching health colour. Health therefore appears strictly
  // inside fields — green outside a field is obviously just satellite, and the
  // coloured fills make fields visibly tappable.
  map.addSource("health",{type:"geojson",data:{type:"FeatureCollection",features:[]}});
  map.addLayer({
    id:"health-fill",type:"fill",source:"health",
    paint:{"fill-color":["get","col"],"fill-opacity":0.72}
  }, map.getLayer("fields-line") ? "fields-line" : undefined);

  // --- MODIS NDVI backdrop (low-zoom country-scale overview) ---
  // Replaces the former FTW-confidence purple wash, which answered "where are
  // there fields" — something the polygons themselves answer once you zoom in —
  // and depended on titiler.xyz, a third-party tiler we don't control.
  //
  // This shows where anything is actually GREEN right now: the Kurdish foothills,
  // the Tigris and Euphrates corridors, the southern marshes. At country zoom
  // that reads as a map of Iraqi agriculture rather than a data-coverage mask.
  //
  // SOURCE: NASA GIBS, MODIS Terra NDVI 8-day composite, 250 m, pre-coloured PNG
  // tiles. Public domain, CORS-open, no key. Verified on-device 2026-10-17.
  // The GIBS pyramid stops at zoom 9 (GoogleMapsCompatible_Level9).
  //
  // PALETTE NOTE: this IS green, unlike the purple it replaces, so it could in
  // principle be confused with the per-field health scale. It's kept apart by
  // zoom instead of by hue: full strength at and below z10, gone by z12, where
  // tappable field polygons take over. The two are never on screen together.
  //
  // Settings tuned on-device via backdroptest.html: opacity 0.58, saturation
  // 145%. MapLibre has no per-layer blend mode, so the CSS `color` blend used
  // in that test is approximated with raster-saturation (-1…1, so 0.45 ≈ 145%).
  /* Fire-and-forget: resolving the window needs a network round trip or three,
     and nothing else on the map should wait for a backdrop. Awaiting this here
     delayed every layer added below it by as long as the probe loop took. */
  (async () => {
    try{
      const ndviDate = await resolveNdviWindow();
      if(!ndviDate) return;
      if(map.getSource("ndvi-backdrop")) return;
      map.addSource("ndvi-backdrop",{
        type:"raster",
        tiles:[gibsNdviTiles(ndviDate)],
        tileSize:256, maxzoom:9,
        attribution:"NDVI backdrop: NASA EOSDIS GIBS (MODIS Terra)"
      });
      map.addLayer({
        id:"ndvi-backdrop", type:"raster", source:"ndvi-backdrop",
        minzoom:3, maxzoom:12,
        paint:{
          "raster-opacity":["interpolate",["linear"],["zoom"],3,0.58,10,0.58,12,0],
          "raster-saturation":0.45,
          "raster-fade-duration":200
        }
      }, map.getLayer("roads") ? "roads" : undefined);
      DBG.log("NDVI backdrop installed, window "+ndviDate);
    }catch(e){
      DBG.err("ndvi-backdrop: "+(e.message||e));
      console.warn("ndvi-backdrop layer:",e);
    }
  })();

  // --- FTW field boundaries as PMTiles ---
  try{
    map.addSource("ftw",{type:"vector",url:"pmtiles://"+FTW_PMTILES});
    // At country scale the "ndvi-backdrop" RASTER layer added earlier in this
    // file carries the overview; these vector polygons only begin at
    // FTW_MIN_ZOOM. The backdrop is faded out by z12 so the two never overlap.
    map.addLayer({
      id:"fields-fill",type:"fill",source:"ftw","source-layer":FTW_SRC_LAYER,
      minzoom:FTW_MIN_ZOOM,
      paint:{"fill-color":"#ffffff","fill-opacity":0.001}
    });
    // Visible outline so coverage is obvious before any tap.
    map.addLayer({
      id:"fields-line",type:"line",source:"ftw","source-layer":FTW_SRC_LAYER,
      minzoom:FTW_MIN_ZOOM,
      paint:{"line-color":"#F3EFE4",
             "line-width":["interpolate",["linear"],["zoom"],11,0.5,15,1.6],
             "line-opacity":0.85}
    });
    // Selection highlight uses a GeoJSON source we control (the tapped polygon's
    // own geometry), NOT the tile feature-id — so it stays put through pan/zoom/
    // tile refresh and is reliably visible in a shared screenshot.
    map.addSource("sel",{type:"geojson",data:{type:"FeatureCollection",features:[]}});
    map.addLayer({
      id:"sel-fill",type:"fill",source:"sel",
      paint:{"fill-color":"#D9A441","fill-opacity":0.18}
    });
    map.addLayer({
      id:"sel-line",type:"line",source:"sel",
      paint:{"line-color":"#D9A441","line-width":3.5,
             "line-opacity":1}
    });

    // Recount fields whenever the FTW source finishes loading tiles for the
    // current view, and whenever rendering settles — not only on moveend, or
    // the count stays stale/zero until the user nudges the map.
    let ftwEverLoaded=false;
    map.on("sourcedata",e=>{
      if(e.sourceId==="ftw" && e.isSourceLoaded){ ftwEverLoaded=true; checkCoverage(); }
    });
    map.on("idle", checkCoverage);
    map.on("moveend", checkCoverage);

    function checkCoverage(){
      if(!map.getLayer("fields-fill")) return;
      const zoomHint = document.getElementById("zoom-hint");
      const t = I18N[lang];
      if(map.getZoom() < FTW_MIN_ZOOM){
        diag(D.fields,"",""); // blank; the centred zoom banner explains this state
        if(zoomHint && !(typeof tourActive!=="undefined" && tourActive)) zoomHint.hidden = false;
        return;
      }
      if(zoomHint) zoomHint.hidden = true;
      const feats = map.queryRenderedFeatures({layers:["fields-fill"]});
      if(feats.length){
        diag(D.fields, `${feats.length} ${t.fieldsInView}`, "");
      } else if(!ftwEverLoaded || !map.areTilesLoaded()){
        diag(D.fields, t.loadingFields, "");   // tiles still arriving — not "empty"
      } else {
        diag(D.fields, t.noFieldsHere, "");
      }
    }

    map.on("click","fields-fill",onFieldTap);
    map.on("mouseenter","fields-fill",()=>map.getCanvas().style.cursor="pointer");
    map.on("mouseleave","fields-fill",()=>map.getCanvas().style.cursor="");

    // Sample & colour visible fields whenever the map settles (if overlay on).
    map.on("idle", ()=>{ scheduleHealthSample(); });
  }catch(e){ diag(D.fields,"error","err"); showErr("Fields layer failed: "+e.message); }

  // --- live geo readout ---
  const upd=()=>{
    const c=map.getCenter();
    D.geo.textContent = `lat ${c.lat.toFixed(4)}, lon ${c.lng.toFixed(4)}  z ${map.getZoom().toFixed(1)}`;
  };
  map.on("move",upd); upd();

  // --- keep the address bar in sync with the current view ---
  // On every settled move, rewrite the URL to ?lat=&lon=&z= for the current
  // centre and zoom, so copying the URL (or refreshing) shares/restores exactly
  // what the user is looking at. We use replaceState (not pushState) so this does
  // NOT flood the back button — one tap still leaves the site, like Google Maps.
  // The address bar tracks the VIEW; the field Share button remains the way to
  // share a specific field with its reading.
  let __urlSyncOn = false;   // enabled after the initial load/flyto settles
  function syncUrlToView(){
    if(!__urlSyncOn) return;
    const c = map.getCenter();
    const params = new URLSearchParams(location.search);
    params.set("lat", c.lat.toFixed(5));
    params.set("lon", c.lng.toFixed(5));
    params.set("z",   map.getZoom().toFixed(1));
    params.set("lang", lang);            // don't let a map move drop the language
    try{ history.replaceState(null, "", location.pathname + "?" + params.toString()); }catch{}
  }
  map.on("moveend", syncUrlToView);

  // If opened via a shared field link (?lat=&lon=), go straight to that field
  // and skip the tour. Otherwise, maybe run the first-time tour.
  let sharedField = false;
  try{
    const q = new URLSearchParams(location.search);
    const la = parseFloat(q.get("lat")), lo = parseFloat(q.get("lon"));
    if(isFinite(la) && isFinite(lo)){
      sharedField = true;
      const z = parseFloat(q.get("z")); 
      map.jumpTo({center:[lo,la], zoom: isFinite(z)?z:16});
      // let field tiles load, then select the field at that point
      setTimeout(()=>flyToField(lo, la), 700);
    }
  }catch{}

  // Everything (map, sel source, field layers) now exists — safe to auto-run the
  // first-time tour. Must be here, not at top-level, or startTour runs before
  // the map is ready and silently fails.
  if(!sharedField && typeof maybeAutoTour==="function") maybeAutoTour();

  // Enable live URL syncing only after the initial view (default, shared link,
  // or tour jump) has settled — otherwise the first auto-move would overwrite an
  // incoming shared link before it's applied.
  setTimeout(()=>{ __urlSyncOn = true; syncUrlToView(); }, 1200);
}

/* ---------- field tap -> current NDVI (sampled via /statistics) ---------- */
const sheet = document.getElementById("sheet");
const sheetBody = document.getElementById("sheet-body");
function closeSheet(){
  sheet.classList.remove("open");
  sheet.style.transform = "";            // clear any drag offset
  const selSrc = map.getSource("sel");
  if(selSrc) selSrc.setData({type:"FeatureCollection",features:[]});
}
document.getElementById("sheet-close").addEventListener("click", closeSheet);

/* Swipe the sheet down to dismiss it.
   The grip looks like a drag handle, so people try to drag it — and nothing
   happening reads as the app being broken. Dragging starts only from the grip
   or the title block, so taps inside the sheet's cards, chart and buttons are
   untouched. Release past ~90px, or with a quick downward flick, closes it;
   anything less snaps back. */
(function(){
  let startY = 0, dy = 0, dragging = false, t0 = 0;
  const canStart = e => !!(e.target.closest(".grip, h2, .sub"));
  sheet.addEventListener("pointerdown", e=>{
    if(!sheet.classList.contains("open") || !canStart(e)) return;
    dragging = true; startY = e.clientY; dy = 0; t0 = performance.now();
    sheet.classList.add("dragging");
    try{ sheet.setPointerCapture(e.pointerId); }catch{}
  });
  sheet.addEventListener("pointermove", e=>{
    if(!dragging) return;
    dy = Math.max(0, e.clientY - startY);          // downward only
    sheet.style.transform = `translateY(${dy}px)`;
    e.preventDefault();
  });
  function end(){
    if(!dragging) return;
    dragging = false;
    sheet.classList.remove("dragging");
    const v = dy / Math.max(1, performance.now() - t0);   // px per ms
    if(dy > 90 || v > 0.5) closeSheet();
    else sheet.style.transform = "";                      // snap back
  }
  sheet.addEventListener("pointerup", end);
  sheet.addEventListener("pointercancel", end);
})();

/* ---------- field-only health sampling ---------- */
let healthOn = true;                 // Health map toggle state
const __healthCache = new Map();     // fieldKey -> {v, col} (NDVI never re-fetched)
const __moistCache = new Map();      // fieldKey -> {v} NDMI moisture (sampled on tap)
const __rainCache = new Map();       // fieldKey -> { "YYYY-MM": {mm, tmax, tmin}, ... } 24 monthly totals from Open-Meteo
let __healthTimer = null;
let __healthRunId = 0;

function fieldKey(f){
  const c = polyCentroid(f.geometry);
  return c ? `${c[0].toFixed(4)},${c[1].toFixed(4)}` : JSON.stringify(f.geometry).slice(0,40);
}
function bboxArea(g){
  const b = geomBbox(g); if(!b) return 0;
  return Math.abs((b[2]-b[0])*(b[3]-b[1]));
}
function healthFeature(f, col){
  return {type:"Feature", properties:{col}, geometry:f.geometry};
}
const __healthShown = new Map();     // fieldKey -> colored feature currently on the layer
function renderHealth(){
  const src = map.getSource("health");
  if(src) src.setData({type:"FeatureCollection", features:Array.from(__healthShown.values())});
}
/* Reconcile the shown-set to a run's results WITHOUT clearing first. Fields that
   are still in view keep their existing colour (no flash); newly-resolved fields
   are added/updated; fields no longer in the in-view key-set are dropped. This
   replaces the old clear()-then-rebuild, which briefly wiped freshly-tapped
   fields and made their colour flicker. */
function pushHealth(resultMap, inViewKeys){
  // add / update everything the run resolved
  for(const [k,feat] of resultMap){ __healthShown.set(k, feat); }
  // drop only fields that are no longer in view (if we were told the view set)
  if(inViewKeys){
    for(const k of Array.from(__healthShown.keys())){
      if(!inViewKeys.has(k)) __healthShown.delete(k);
    }
  }
  renderHealth();
}
/* Add/replace a single coloured field immediately (used when a tapped field's
   NDVI arrives before the next sample run). Never removes anything. */
function mergeHealthField(f, col){
  if(!map.getSource("health")) return;
  __healthShown.set(fieldKey(f), healthFeature(f, col));
  renderHealth();
}
function scheduleHealthSample(){
  clearTimeout(__healthTimer);
  __healthTimer = setTimeout(runHealthSample, 350);   // debounce map settling
}
async function runHealthSample(){
  const src = map.getSource("health");
  if(!src) return;
  if(!healthOn || map.getZoom() < FTW_MIN_ZOOM){
    src.setData({type:"FeatureCollection",features:[]});
    return;
  }
  const runId = ++__healthRunId;
  let feats = [];
  try{ feats = map.queryRenderedFeatures({layers:["fields-fill"]}); }catch{ return; }
  const seen = new Set(), uniq = [];
  for(const f of feats){
    const k = fieldKey(f);
    if(seen.has(k)) continue; seen.add(k);
    uniq.push({f, k, area: bboxArea(f.geometry)});
  }
  uniq.sort((a,b)=> b.area - a.area);          // biggest fields first
  const batch = uniq.slice(0, 45);             // cap API volume
  const inViewKeys = new Set(uniq.map(u=>u.k));  // every field currently visible

  const out = new Map();
  for(const {f,k} of batch){
    const cached = __healthCache.get(k);
    if(cached && cached.v!=null) out.set(k, healthFeature(f, cached.col));
  }
  // First push: add cached results, but DON'T drop anything yet (no flicker of
  // freshly-tapped fields whose sample is still pending).
  pushHealth(out);

  const now = new Date();
  // Use the CURRENT calendar month only (1st of this month → today), matching
  // the newest bucket the field-tap uses. Previously this window started on the
  // 1st of LAST month, and because scenes are picked least-cloudy-first (not
  // newest-first), the sampler could grab last month's clearer scene — colouring
  // the polygon with an older value that disagreed with the sheet's current
  // reading. Restricting to this month keeps the two in sync.
  const from = new Date(now.getFullYear(), now.getMonth(), 1);
  const iso = d=> d.toISOString().slice(0,10);
  const todo = batch.filter(({k})=> !__healthCache.has(k));
  let i = 0;
  async function worker(){
    while(i < todo.length){
      if(runId !== __healthRunId) return;      // superseded by a newer run
      const {f,k} = todo[i++];
      try{
        const r = await ndviForWindow(f.geometry, iso(from), iso(now));
        if(r && r.value!=null){
          const col = ndviColorHex(r.value);
          __healthCache.set(k, {v:r.value, col});
          out.set(k, healthFeature(f, col));
          if(runId === __healthRunId && (i % 3 === 0 || i === todo.length)) pushHealth(out);
        } else {
          __healthCache.set(k, {v:null, col:null});
        }
      }catch{ /* skip */ }
    }
  }
  await Promise.all(Array.from({length:4}, worker));   // small concurrency
  // Final push: now reconcile against the in-view set — this is the only point
  // we drop fields that scrolled out of view.
  if(runId === __healthRunId) pushHealth(out, inViewKeys);
}

async function onFieldTap(e){
  const f = e.features && e.features[0];
  if(!f) return;
  DBG.log("── tap "+(resolveFieldId(f)||"?")+" healthOn="+healthOn);
  // Lock the highlight to this polygon's geometry (survives pan/zoom/tile refresh).
  const selSrc = map.getSource("sel");
  if(selSrc) selSrc.setData({type:"Feature",properties:{},geometry:f.geometry});
  lastField = f;
  sheet.classList.add("open");
  // Pan the tapped field into the area still visible ABOVE the sheet, so the
  // popup doesn't cover the field you just tapped. We center the field's
  // centroid using easeTo with bottom padding equal to the sheet's height:
  // MapLibre then frames the field in the remaining viewport above the sheet,
  // not the full screen. Measured after the sheet lays out (rAF), and only
  // nudged if the field centroid actually falls under the sheet.
  requestAnimationFrame(()=>{
    try{
      const c = polyCentroid(f.geometry);
      if(!c) return;
      const sheetH = sheet.offsetHeight || Math.round(window.innerHeight*0.5);
      const pt = map.project([c[0], c[1]]);
      const coveredTop = window.innerHeight - sheetH;   // y below this is hidden
      // Only move if the field sits under the sheet (or near its edge).
      if(pt.y > coveredTop - 40){
        // Place the field centroid in the middle of the visible strip above the
        // sheet. Move the map center up by (current field y − target y) pixels,
        // via project/offset/unproject — no persistent padding, so the locate
        // button's later flyTo isn't affected.
        const targetY = coveredTop/2;
        const dy = pt.y - targetY;                       // >0 → shift view up
        const ctr = map.project(map.getCenter());
        const center = map.unproject([ctr.x, ctr.y + dy]);
        map.easeTo({ center, duration:500 });
      }
    }catch{}
  });
  // If the interactive tour is waiting for the user to tap a field, advance it.
  if(typeof window.__onTourFieldTap==="function") window.__onTourFieldTap();

  // Reuse cached history if this exact field was tapped before AND it finished
  // loading. A partially-loaded field (tap interrupted by another tap) is re-run.
  const cacheKey = resolveFieldId(f) || JSON.stringify(geomBbox(f.geometry));
  if(historyCache.has(cacheKey)){
    const cached = historyCache.get(cacheKey);
    const done = cached.filter(s=>!s.pending).length;
    if(done >= cached.length - 2){               // essentially complete
      f.__history = cached;
      renderField(f);
      return;
    }
    // else fall through and re-load this field's history
  }

  // Build the 24-month skeleton (oldest -> newest) and render it empty,
  // then fill each month in as its API calls return (progressive).
  const months = buildMonths(24);
  f.__history = months.map(m=>({label:m.label, ym:m.ym, year:m.year, monthIdx:m.monthIdx, from:m.from, to:m.to, v:null, pending:true}));
  historyCache.set(cacheKey, f.__history);
  renderField(f);

  // --- moisture (NDMI) for this field + a few neighbours, sampled on tap ---
  // Moisture isn't sampled constantly (that would double API load); we fetch it
  // when a field is opened. We sample the tapped field and up to ~12 nearby
  // fields so we can say whether this field is wetter/drier than its neighbours.
  sampleMoisture(f).catch(()=>{});
  // --- 2-year rainfall + temperature (Open-Meteo archive), for report + popup line ---
  sampleRain(f).catch(()=>{});
  // TEMP A/B probe: compare ERA5 (25km) vs Historical-Forecast (9km) rainfall
  // for this exact field, side by side. Gated behind ?raintest=1. Throwaway.
  if(new URLSearchParams(location.search).get("raintest")==="1") rainAB(f).catch(()=>{});

  // Colour the tapped polygon IMMEDIATELY: fetch just the current month first,
  // as a standalone call, so the field recolours right away instead of waiting
  // in line behind the full 24-month history fill.
  if(healthOn){
    const k = fieldKey(f);
    const cached = __healthCache.get(k);
    if(cached && cached.v!=null){
      mergeHealthField(f, cached.col);            // already known — instant
    }else{
      const cur = f.__history[f.__history.length-1];
      ndviForWindow(f.geometry, cur.from, cur.to).then(r=>{
        if(r && r.value!=null){
          const col = ndviColorHex(r.value);
          __healthCache.set(k, {v:r.value, col});
          mergeHealthField(f, col);
          // seed the history slot too, so the loop below skips re-fetching it
          cur.v = r.value; cur.date = r.date; cur.scene = r.scene; cur.cloud = r.cloud; cur.pending = false;
          if(lastField===f && sheet.classList.contains("open")) renderField(f);
        }
        DBG.log(`current-month quick: ${r && r.value!=null ? r.value.toFixed(3)+" "+r.date : "null "+(r&&r.err)}`);
      }).catch(e=>DBG.err("current-month quick threw: "+(e.stack||e.message)));
    }
  }

  // Fill newest-first so the current reading and this-month card populate fast.
  // Guard with a tap generation: if the user taps a DIFFERENT field, this loop
  // stops immediately instead of running all 24 months in the background and
  // clogging the request pipe (which made later taps stall).
  const myTap = ++__tapGen;
  const order = [...f.__history.keys()].reverse();
  for(const idx of order){
    if(myTap !== __tapGen) return;                 // a newer tap superseded us
    const slot = f.__history[idx];
    if(slot.v!=null && !slot.pending) continue;   // already seeded (e.g. current month)
    try{
      const r = await ndviForWindow(f.geometry, slot.from, slot.to);
      slot.v = r.value; slot.date = r.date; slot.err = r.err;
      slot.scene = r.scene; slot.cloud = r.cloud;
    }catch(err){ slot.v = null; slot.err = err.message; DBG.err(`month ${slot.ym} threw: ${err.stack||err.message}`); }
    slot.pending = false;
    DBG.log(`month ${slot.ym} → ${slot.v!=null ? slot.v.toFixed(3) : "null ("+slot.err+")"}`);
    if(lastField===f && sheet.classList.contains("open")) renderField(f); // live update
  }
  // Reading complete — log this field to history (ranked later by improvement).
  try{
    const id = resolveFieldId(f);
    const c = polyCentroid(f.geometry);
    if(id && c){
      const hist = f.__history;
      let cur=null; for(let i=hist.length-1;i>=0;i--){ if(hist[i].v!=null){ cur=hist[i].v; break; } }
      const yoy = computeYoY(hist);
      logHistory({id, lon:c[0], lat:c[1], ndvi:cur, band:healthBand(cur),
                  improve: (yoy && typeof yoy.diff==="number") ? yoy.diff : null,
                  improvePct: (yoy && typeof yoy.pct==="number") ? yoy.pct : null});
    }
  }catch(err){ console.warn("history:",err.message); }
}

/* Build n calendar months ending with the current month; oldest first.
   Each entry: {label:"Jul", ym:"2026-07", from, to} as YYYY-MM-DD strings. */
function buildMonths(n){
  const out = [];
  const now = new Date();
  for(let i=n-1;i>=0;i--){
    const d = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth()-i, 1));
    const start = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), 1));
    const end   = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth()+1, 0));
    const iso = x=>x.toISOString().slice(0,10);
    const mon = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][d.getUTCMonth()];
    out.push({
      label:mon, monthIdx:d.getUTCMonth(), year:d.getUTCFullYear(),
      ym:`${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,"0")}`,
      from:iso(start), to:iso(end)
    });
  }
  return out;
}

const historyCache = new Map();
let __tapGen = 0;   // increments each field tap; supersedes older tap loads
let __sparkDots = [];      // {i,cx,cy,v,label,year,date,thisYear} per rendered dot
let __hoverDot = null;     // index of currently highlighted dot
let __pinnedDot = null;    // index of dot with provenance panel pinned open

/* NDVI mean for a field within a date window.
   A single scene can be cloudy over THIS field even if the month had several
   Sentinel-2 passes, so we fetch multiple candidate scenes (least-cloudy first)
   and try each until one returns a real, unmasked NDVI. Only if every candidate
   is masked/cloudy over the field do we report the month as empty. */

/* Fetch with a small retry-and-backoff on rate-limit / transient errors.
   Planetary Computer can return 429 ("Too Many Requests") or 503 when we sample
   many fields at once; retrying after a short, growing wait usually succeeds, so
   fewer fields silently fail to colour. Waits ~0.4s, 0.8s, 1.6s across 3 retries.
   Honours a Retry-After header when the server provides one. */
async function fetchRetry(url, opts, tries=3, timeoutMs=20000){
  let wait = 400;
  if(Date.now() < __pcPauseUntil) throw new TypeError("breaker open (PC paused)");
  for(let attempt=0; ; attempt++){
    let r;
    // Per-attempt timeout: an overloaded backend can hang with no response
    // (issue #476), which would otherwise leave the UI stuck on "Reading…"
    // forever. AbortController turns a hang into a catchable error so the
    // retry logic can kick in.
    const ac = new AbortController();
    const timer = setTimeout(()=>ac.abort(), timeoutMs);
    const tf = performance.now();
    try{ r = await fetch(url, {...opts, signal: ac.signal}); }
    catch(e){ clearTimeout(timer);
      DBG.err(`FETCH THREW ${e.name}: ${e.message} · ${dbgUrl(url)} · try ${attempt+1} · ${Math.round(performance.now()-tf)}ms`);
      if(e.name!=="AbortError" && ++__pcFails >= 8 && Date.now() >= __pcPauseUntil){
        __pcPauseUntil = Date.now()+30000; __pcFails = 0;
        DBG.err("BREAKER: 8 network failures → pausing PC requests 30s");
      }
      if(attempt>=tries || Date.now() < __pcPauseUntil) throw e; await sleep(wait); wait*=2; continue; }
    clearTimeout(timer); __pcFails = 0;
    { const ms=Math.round(performance.now()-tf);
      if(r.ok) DBG.log(`${r.status} ${ms}ms ${dbgUrl(url)}`);
      else { let snip=""; try{ snip=(await r.clone().text()).slice(0,220).replace(/\s+/g," "); }catch{}
             DBG.err(`HTTP ${r.status} ${ms}ms ${dbgUrl(url)} try ${attempt+1} :: ${snip}`); } }
    // Retry transient server/gateway errors: 429/503 (rate/unavailable) and
    // 502/504 (bad-gateway/gateway-timeout — the signature of a stressed
    // backend during Planetary Computer's migration).
    if((r.status===429 || r.status===502 || r.status===503 || r.status===504) && attempt<tries){
      const ra = parseFloat(r.headers.get("retry-after"));
      await sleep(isFinite(ra) ? ra*1000 : wait);
      wait*=2; continue;
    }
    return r;
  }
}
function sleep(ms){ return new Promise(res=>setTimeout(res, ms)); }

async function ndviForWindow(geometry, from, to, expr){
  expr = expr || NDVI_EXPR;
  // Physical bounds of the index, used to reject blown-up pixel math (near-zero
  // denominators / dark pixels). NDVI and NDMI are both bounded to [-1,1].
  const bound = 1;
  const bbox = geomBbox(geometry);
  if(!bbox) throw new Error("bad geometry");
  /* GET, not POST. Planetary Computer's edge stopped answering CORS preflight
     (OPTIONS) requests, and a POST carrying `Content-Type: application/json` is
     never a "simple" request — the browser must preflight it, so every search
     died as an opaque `TypeError: Load failed` before reaching the API. A GET
     with only safelisted headers needs no preflight and goes straight through.
     The `query` extension has no GET equivalent, so the cloud-cover ceiling is
     applied client-side below; `sortby` still orders clearest-scene-first. */
  const sq = new URLSearchParams({
    collections:"sentinel-2-l2a",
    bbox:bbox.join(","),
    datetime:`${from}T00:00:00Z/${to}T23:59:59Z`,
    sortby:"+eo:cloud_cover",
    limit:"12"
  }).toString();
  const sr = await fetchRetry(`https://planetarycomputer.microsoft.com/api/stac/v1/search?${sq}`,{method:"GET"});
  if(!sr.ok) return {value:null, err:"search "+sr.status};
  const sj = await sr.json();
  // Cloud ceiling, formerly the server-side query filter (see above).
  const items = (sj.features||[])
    .filter(it => { const c = it.properties && it.properties["eo:cloud_cover"]; return c==null || c < 60; })
    .slice(0,8);
  if(!items.length){ DBG.warn(`no scene ${from}..${to} expr=${expr}`); return {value:null, err:"no scene"}; }
  const reasons = [];

  const feature = {type:"Feature",properties:{},geometry};
  let triedMasked = 0;
  // Walk candidates clearest-first; return the first that yields real NDVI.
  for(const item of items){
    const itemDate = (item.properties && item.properties.datetime || "").slice(0,10);
    const qs = new URLSearchParams({
      collection:"sentinel-2-l2a",
      item:item.id,
      expression:expr,
      asset_as_band:"true"
    }).toString();
    let stR;
    try{
      /* Preflight-free POST: a Blob with an empty type means the browser sends
         NO Content-Type header at all, which keeps this a "simple" request (no
         OPTIONS — see the search comment above). FastAPI parses a body with no
         declared content type as JSON, so titiler still reads the feature.
         Sending `application/json` here would trigger a preflight and fail. */
      stR = await fetchRetry(`${PC}/item/statistics?${qs}`,{
        method:"POST",
        body:new Blob([JSON.stringify(feature)])
      });
    }catch(e){ reasons.push("threw:"+(e.name||e.message)); continue; }
    if(!stR.ok){ reasons.push("http"+stR.status); continue; }   // try next candidate
    let stJ; try{ stJ = await stR.json(); }catch(e){ reasons.push("badjson"); DBG.err("stats JSON parse failed"); continue; }
    const stats = firstStats(stJ);
    if(!stats && !window.__dbgShapeLogged){
      window.__dbgShapeLogged = true;
      DBG.err("stats shape unrecognised: "+JSON.stringify(stJ).slice(0,400));
    }
    // Prefer the MEDIAN: it's immune to a handful of blown-up pixels (near-zero
    // denominator) that could skew the mean. titiler may key it as 'median' or
    // 'percentile_50'. Fall back to mean if neither present.
    let val = stats && (stats.median ?? stats.Median ?? stats["percentile_50"] ?? stats["50"]);
    if(val==null) val = stats && (stats.mean ?? stats.Mean);
    // Bounded to the index's physical range (see `bound` above). Anything
    // outside means the pixel math blew up over bare/dark pixels, so reject
    // and try the next scene.
    if(val!=null && isFinite(val) && val>=-bound && val<=bound){
      return {value:val, date:itemDate, scene:item.id, cloud:item.properties && item.properties["eo:cloud_cover"], tried:triedMasked+1};
    }
    reasons.push(stats ? ("val="+val+" keys="+Object.keys(stats).slice(0,6).join(",")) : "nostats");
    triedMasked++;                              // masked / invalid — keep looking
  }
  // Every candidate scene was masked/cloudy over this field.
  DBG.warn(`${from.slice(0,7)} ${expr===NDVI_EXPR?"NDVI":"expr"} null · ${items.length} scenes · ${reasons.join(" | ").slice(0,300)}`);
  return {value:null, err:`masked ×${triedMasked}`};
}

/* Sample NDMI moisture for the tapped field plus a handful of nearby visible
   fields, so we can show the field's moisture AND whether it's wetter/drier than
   its neighbours. Sampled on tap (not constantly) to limit API load. Uses the
   current calendar month, like the health sampler. Re-renders the sheet as
   values arrive. */
async function sampleMoisture(f){
  const now = new Date();
  const from = new Date(now.getFullYear(), now.getMonth(), 1);
  const iso = d=> d.toISOString().slice(0,10);
  const myKey = fieldKey(f);
  const myGen = __tapGen;   // tie to the current tap so stale samples don't render

  // 1) the tapped field's moisture first (its own value)
  if(!__moistCache.has(myKey)){
    try{
      const r = await ndviForWindow(f.geometry, iso(from), iso(now), NDMI_EXPR);
      if(r && r.value!=null) __moistCache.set(myKey, {v:r.value});
      else __moistCache.set(myKey, {v:null});
    }catch{ __moistCache.set(myKey, {v:null}); }
  }
  const mine = __moistCache.get(myKey);
  f.__moisture = mine ? mine.v : null;
  if(lastField===f && sheet.classList.contains("open")) renderField(f);

  // 2) a few neighbours for the comparison (only if we have a value to compare)
  if(f.__moisture==null) return;
  let feats = [];
  try{ feats = map.queryRenderedFeatures({layers:["fields-fill"]}); }catch{ return; }
  const seen = new Set([myKey]); const neighbours = [];
  for(const nf of feats){
    const k = fieldKey(nf);
    if(seen.has(k)) continue; seen.add(k);
    neighbours.push({f:nf, k, area: bboxArea(nf.geometry)});
  }
  neighbours.sort((a,b)=> b.area - a.area);
  const pick = neighbours.slice(0, 12);   // enough for a stable comparison
  let i=0;
  async function worker(){
    while(i < pick.length){
      if(myGen !== __tapGen) return;      // user tapped elsewhere — stop
      const {f:nf,k} = pick[i++];
      if(__moistCache.has(k)) continue;
      try{
        const r = await ndviForWindow(nf.geometry, iso(from), iso(now), NDMI_EXPR);
        __moistCache.set(k, {v:(r && r.value!=null)? r.value : null});
      }catch{ __moistCache.set(k, {v:null}); }
      if(myGen===__tapGen && lastField===f && sheet.classList.contains("open")) renderField(f);
    }
  }
  await Promise.all(Array.from({length:3}, worker));
  if(myGen===__tapGen && lastField===f && sheet.classList.contains("open")) renderField(f);
}

/* Sample 24 months of rainfall + temperature for the field, from Open-Meteo's
   free ERA5 archive (no API key — fits the single-file, no-secrets design).
   ONE request covers the whole span (a date range), aggregated to monthly totals
   keyed by "YYYY-MM" so they align 1:1 with f.__history's months. Precipitation
   is summed per month (mm); temperature is the monthly mean of daily max/min.
   Weather is a ~1km grid cell, not the exact field — fine for rain/temp, which
   vary smoothly — so it's framed in the UI as "area" context. Cached hard: a
   field's past rainfall doesn't change, so we never re-fetch. Data © Open-Meteo
   (CC BY 4.0); attribution shown with the report chart. */
async function sampleRain(f){
  const myKey = fieldKey(f);
  const myGen = __tapGen;
  if(__rainCache.has(myKey)){
    if(myGen===__tapGen && lastField===f && sheet.classList.contains("open")) renderField(f);
    return;
  }
  const months = (f.__history && f.__history.length) ? f.__history : buildMonths(24);
  const start = months[0].from, end = months[months.length-1].to;
  const c = polyCentroid(f.geometry);
  if(!c){ __rainCache.set(myKey, {}); return; }
  try{
    // NOTE: tried ERA5-Land (models=era5_land) for finer 0.1° resolution, but it
    // returned empty precipitation (every month 0mm) — it doesn't serve daily
    // precipitation_sum the way default ERA5 does. Reverted to default ERA5
    // (0.25°, ~25km), which works. Coarser, but real data beats finer nothing.
    // Clamp end to 9 days back to stay clear of the archive's ~5-8 day latency.
    const safeEnd = new Date(Date.now() - 9*86400*1000).toISOString().slice(0,10);
    const reqEnd = (end > safeEnd) ? safeEnd : end;
    const url = "https://archive-api.open-meteo.com/v1/archive"
      + `?latitude=${c[1].toFixed(4)}&longitude=${c[0].toFixed(4)}`
      + `&start_date=${start}&end_date=${reqEnd}`
      + "&daily=precipitation_sum,temperature_2m_max,temperature_2m_min&timezone=auto";
    const r = await fetch(url);
    if(!r.ok) throw new Error("archive HTTP "+r.status);
    const j = await r.json();
    const d = j && j.daily;
    const out = {};
    if(d && d.time){
      for(let i=0;i<d.time.length;i++){
        const ym = d.time[i].slice(0,7);            // "YYYY-MM"
        if(!out[ym]) out[ym] = {mm:0, tsum:0, tn:0};
        const p = d.precipitation_sum ? d.precipitation_sum[i] : null;
        if(p!=null && isFinite(p)) out[ym].mm += p;
        const tx = d.temperature_2m_max ? d.temperature_2m_max[i] : null;
        const tnv = d.temperature_2m_min ? d.temperature_2m_min[i] : null;
        if(tx!=null && tnv!=null && isFinite(tx) && isFinite(tnv)){
          out[ym].tsum += (tx+tnv)/2; out[ym].tn += 1;
        }
      }
    }
    // finalize: mm total + mean temp per month
    const fin = {};
    for(const ym in out){
      fin[ym] = { mm: out[ym].mm, temp: out[ym].tn ? out[ym].tsum/out[ym].tn : null };
    }
    __rainCache.set(myKey, fin);
  }catch(e){
    __rainCache.set(myKey, {});   // empty = tried, no data; UI omits gracefully
  }
  if(myGen===__tapGen && lastField===f && sheet.classList.contains("open")) renderField(f);
}

/* TEMP A/B PROBE (throwaway, ?raintest=1 only): fetch this field's trailing-12-
   month rainfall from BOTH sources and show them side by side, so we can judge
   whether the finer 9km data is actually better than the 25km ERA5 before
   committing. Source A = default ERA5 archive (25km, current production). Source
   B = Historical Forecast API (9km, forecast-stitched). Same window + monthly
   aggregation for both. Result is dumped to console AND shown as a toast. */
async function rainAB(f){
  const c = polyCentroid(f.geometry); if(!c) return;
  const months = (f.__history && f.__history.length) ? f.__history : buildMonths(24);
  const start = months[0].from;
  const safeEnd = new Date(Date.now() - 9*86400*1000).toISOString().slice(0,10);
  const end = months[months.length-1].to;
  const reqEnd = (end > safeEnd) ? safeEnd : end;
  const la = c[1].toFixed(4), lo = c[0].toFixed(4);
  const A = `https://archive-api.open-meteo.com/v1/archive?latitude=${la}&longitude=${lo}`
    + `&start_date=${start}&end_date=${reqEnd}&daily=precipitation_sum&timezone=auto`;
  const B = `https://historical-forecast-api.open-meteo.com/v1/forecast?latitude=${la}&longitude=${lo}`
    + `&start_date=${start}&end_date=${reqEnd}&daily=precipitation_sum&timezone=auto`;
  // sum trailing-12-months of daily precip from a response
  async function total(url){
    try{
      const r = await fetch(url); if(!r.ok) return {err:"HTTP "+r.status};
      const j = await r.json();
      const d = j && j.daily;
      if(!d || !d.time) return {err:"no daily"};
      // keep only the last 365 days, sum
      const days = d.precipitation_sum || [];
      let mm=0, n=0;
      const cutoff = new Date(Date.now() - 365*86400*1000).toISOString().slice(0,10);
      for(let i=0;i<d.time.length;i++){
        if(d.time[i] < cutoff) continue;
        const v = days[i];
        if(v!=null && isFinite(v)){ mm+=v; n++; }
      }
      return {mm:Math.round(mm), days:n};
    }catch(e){ return {err:(e&&e.message)||"threw"}; }
  }
  const [ra, rb] = await Promise.all([total(A), total(B)]);
  const fmt = r => r.err ? `ERR(${r.err})` : `${r.mm}mm/${r.days}d`;
  const msg = `RAINTEST @${la},${lo}\nERA5 25km: ${fmt(ra)}\nForecast 9km: ${fmt(rb)}`;
  console.warn(msg);
  const toast = document.getElementById("locate-toast");
  if(toast){
    toast.textContent = `ERA5(25km): ${fmt(ra)}  ·  Fcst(9km): ${fmt(rb)}`;
    toast.hidden = false;
    setTimeout(()=>{ toast.hidden = true; }, 12000);
  }
}

/* Sum rainfall (mm) over a slice of the history months, reading the rain cache.
   Returns {mm, cover} where cover = how many of those months had data — so the
   caller can require enough coverage before trusting a year total, mirroring the
   NDVI year-on-year guard. */
function rainTotal(f, fromIdx, toIdx){
  const rc = __rainCache.get(fieldKey(f));
  if(!rc || !f.__history) return null;
  let mm = 0, cover = 0;
  for(let i=fromIdx;i<=toIdx;i++){
    const slot = f.__history[i];
    if(!slot) continue;
    const rec = rc[slot.ym];
    if(rec && rec.mm!=null && isFinite(rec.mm)){ mm += rec.mm; cover++; }
  }
  return {mm, cover};
}


/* Bounding box [w,s,e,n] of a Polygon/MultiPolygon. */
/* Geodesic area of a lat/lon polygon in square metres. Uses the spherical
   excess formula on a WGS84-radius sphere — accurate for field-scale polygons
   at Iraq's latitude, unlike a naive planar area on raw degrees (which would be
   badly wrong because a degree of longitude is ~90km here, not ~111km). Handles
   Polygon and MultiPolygon; subtracts interior rings (holes). Sign is dropped —
   we return absolute area regardless of ring winding order. */
function ringAreaMeters(ring){
  const R = 6378137;                         // WGS84 equatorial radius (m)
  const rad = Math.PI/180;
  let sum = 0;
  for(let i=0;i<ring.length-1;i++){
    const [lon1,lat1] = ring[i], [lon2,lat2] = ring[i+1];
    sum += (lon2-lon1)*rad * (2 + Math.sin(lat1*rad) + Math.sin(lat2*rad));
  }
  return Math.abs(sum * R * R / 2);
}
function geomAreaMeters(g){
  if(!g) return 0;
  const polys = g.type==="Polygon" ? [g.coordinates]
              : g.type==="MultiPolygon" ? g.coordinates : null;
  if(!polys) return 0;
  let total = 0;
  for(const poly of polys){
    if(!poly.length) continue;
    total += ringAreaMeters(poly[0]);        // outer ring
    for(let h=1;h<poly.length;h++) total -= ringAreaMeters(poly[h]); // holes
  }
  return total;
}

function geomBbox(g){
  let ring;
  if(g.type==="Polygon") ring=g.coordinates[0];
  else if(g.type==="MultiPolygon") ring=g.coordinates.flat(1)[0];
  else return null;
  let w=Infinity,s=Infinity,e=-Infinity,n=-Infinity;
  ring.forEach(p=>{ w=Math.min(w,p[0]); e=Math.max(e,p[0]); s=Math.min(s,p[1]); n=Math.max(n,p[1]); });
  return [w,s,e,n];
}

/* Statistics response is a GeoJSON feature; stats live under
   properties.statistics, keyed by the band/expression name. */
function firstStats(j){
  let props = j && j.properties && j.properties.statistics;
  if(!props && j && j.features && j.features[0]){
    props = j.features[0].properties && j.features[0].properties.statistics;
  }
  if(!props) return null;
  const k = Object.keys(props)[0];
  return k ? props[k] : null;
}

/* ---------- render sheet ---------- */
/* Compare this field's value against nearby fields' values (already sampled for
   the health map, in __healthCache). Returns a simple word bucket, or null if we
   don't have enough neighbours to say anything honestly. `getVal` pulls the value
   to compare from a cache entry (NDVI by default). Needs >=5 neighbours. */
function neighborStanding(f, myVal, cache, getVal){
  if(myVal==null) return null;
  const myKey = fieldKey(f);
  const vals = [];
  for(const [k,entry] of cache){
    if(k===myKey) continue;
    const v = getVal(entry);
    if(v!=null && isFinite(v)) vals.push(v);
  }
  if(vals.length < 5) return null;               // too few to compare honestly
  // How many neighbours is this field at or above?
  const below = vals.filter(v=> v < myVal).length;
  const frac = below / vals.length;              // 0..1, higher = greener than more neighbours
  // Simple three-way bucket with a neutral middle band.
  if(frac >= 0.66) return "above";
  if(frac <= 0.33) return "below";
  return "around";
}

function renderField(f){
  const t = I18N[lang];
  const hist = f.__history || [];
  // "current" = newest month that has a value
  let cur = null, curDate = null;
  for(let i=hist.length-1;i>=0;i--){ if(hist[i].v!=null){ cur=hist[i].v; curDate=hist[i].date; break; } }
  const band = healthBand(cur);
  const loading = hist.some(h=>h.pending);
  const done = hist.filter(h=>!h.pending).length;

  // Year-on-year: newest filled month vs the same month one year earlier.
  const yoy = computeYoY(hist);

  sheetBody.innerHTML = `
    <h2>${t.title}</h2>
    <p class="sub">${fieldLabel(f)}${geoLabel(f)}${curDate ? "  ·  "+t.asOf+" "+curDate : ""}${loading?`  ·  ${done}/${hist.length}`:""}</p>
    <div id="stat">
      <div class="card">
        <div class="n" style="color:${ndviColor(cur)}">${cur!=null?cur.toFixed(2):"—"}</div>
        <div class="c">${t.latest}</div>
      </div>
      <div class="card">
        <div class="n" style="color:${ndviColor(cur)}">${band ? t[band] : "—"}</div>
        <div class="c">${t.health}</div>
      </div>
      <div class="card">
        <div class="n" style="color:${yoy.color}">${yoy.text}</div>
        <div class="c">${t.vsLastYear}</div>
      </div>
    </div>
    ${(()=>{
      const st = neighborStanding(f, cur, __healthCache, e=>e.v);
      if(!st) return "";
      return `<div class="nbr"><span class="nbr-ico">🏞️</span> ${t["nbrHealth_"+st]}</div>`;
    })()}
    ${(()=>{
      const mv = f.__moisture;
      if(mv==null) return "";
      // Own moisture value with a rough band word, plus neighbour comparison.
      const band = mv>=0.2 ? "moist" : (mv>=0.0 ? "mid" : "dry");
      const mst = neighborStanding(f, mv, __moistCache, e=>e.v);
      const nbr = mst ? ` — ${t["nbrMoist_"+mst]}` : "";
      return `<div class="nbr"><span class="nbr-ico">💧</span> ${t["moist_"+band]}${nbr}</div>`;
    })()}
    ${(()=>{
      // Rainfall: this year vs last year, using the SAME rolling 12-month windows
      // as the NDVI year-on-year, so the two comparisons align. Neutral wording
      // (wetter/drier), never a "better/worse" verdict — more rain isn't always
      // good. Shown only when both years have enough monthly coverage.
      if(!f.__history || f.__history.length<24) return "";
      const n = f.__history.length;
      const thisY = rainTotal(f, n-12, n-1);
      const lastY = rainTotal(f, n-24, n-13);
      // Require near-complete coverage (>=11 of 12 months). Unlike NDVI, a
      // MISSING rain month contributes 0mm — indistinguishable from a genuinely
      // dry month — so a data gap would silently masquerade as drought. Demanding
      // near-full coverage prevents that false signal.
      if(!thisY || !lastY || thisY.cover<11 || lastY.cover<11) return "";
      const tv = Math.round(thisY.mm), lv = Math.round(lastY.mm);
      const d = tv - lv;
      const dir = d > 15 ? t.rainWetter : d < -15 ? t.rainDrier : t.rainSame;
      return `<div class="nbr"><span class="nbr-ico">🌧️</span> ${tv} ${t.rainMm} ${t.rainThis} · ${lv} ${t.rainMm} ${t.rainLast} — ${dir}</div>`;
    })()}
    <div id="spark-wrap">
      <canvas id="spark" width="640" height="150"></canvas>
      <div id="spark-tip" hidden></div>
      <div id="spark-prov" hidden></div>
    </div>
    <div class="msg ${band||'none'}">
      <div class="msg-main">${cur!=null ? (t[band+"Msg"]) : (loading? t.loading : t.noData)}</div>
      ${yoy.msg?`<div class="msg-sub">${yoy.msg}</div>`:""}
    </div>
    <div class="pv-save">${(()=>{
      const id = resolveFieldId(f);
      const already = id && pinExists(id);
      return `<button class="save-btn ${already?'saved':''}" id="save-field-btn" ${already?'disabled':''}>${already?t.saved:t.save}</button>`+
             `<button class="share-btn" id="share-field-btn">${t.share} ↗</button>`+
             `<button class="share-btn ${__reportReady?'':'loading'}" id="report-field-btn" ${__reportReady?'':'disabled'}>${__reportReady?(t.report+' ↓'):(t.preparing||'Preparing…')}</button>`;
    })()}</div>`;
  drawSpark(hist);
  attachSparkHover(hist);
  const saveBtn = document.getElementById("save-field-btn");
  if(saveBtn) saveBtn.addEventListener("click",()=>{
    const id = resolveFieldId(f);
    const c = polyCentroid(f.geometry);
    if(!id || !c) return;
    addPin({id, lon:c[0], lat:c[1], band: healthBand(cur)});
    saveBtn.textContent = t.saved; saveBtn.classList.add("saved"); saveBtn.disabled = true;
  });
  const shareBtn = document.getElementById("share-field-btn");
  if(shareBtn) shareBtn.addEventListener("click",()=> shareField(f, shareBtn));
